body.large{--fs:24px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari",Roboto,sans-serif;font-size:var(--fs);line-height:1.55}
header{padding:18px 16px 6px;text-align:center}
header h1{margin:0;font-size:1.5em;color:var(--brand-d);letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--muted);font-size:.8em}
main{max-width:640px;margin:0 auto;padding:12px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 2px 10px rgba(47,127,121,.07)}
h2{margin:0 0 6px;font-size:1.2em;line-height:1.35}
.sub{color:var(--muted);font-size:.82em;margin:0 0 16px}
.opts{display:grid;gap:12px;margin-top:14px}
button.opt{font:inherit;width:100%;min-height:64px;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink);text-align:left;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
button.opt:hover,button.opt:focus-visible{border-color:var(--brand);background:#d9ece8;outline:none}
button.opt:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.center{text-align:center}
button.opt.big{font-size:1.15em;text-align:center}
.progress{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:0 0 6px}
.progress>div{height:100%;background:var(--brand);width:0;transition:width .3s}
.pl{display:flex;justify-content:space-between;color:var(--muted);font-size:.75em;margin-bottom:14px}
.q{font-size:1.15em;font-weight:600;margin:6px 0 4px}
.stem{color:var(--muted);font-size:.8em}
.link{background:none;border:none;font:inherit;font-size:.8em;color:var(--brand-d);text-decoration:underline;padding:12px 4px;cursor:pointer}
.banner{border-radius:16px;padding:16px 18px;margin-bottom:16px}
.banner h2{margin:0 0 4px}
.g{background:var(--green-bg);border:2px solid var(--green)} .g h2{color:var(--green)}
.a{background:var(--amber-bg);border:2px solid var(--amber)} .a h2{color:var(--amber)}
.r{background:var(--red-bg);border:2px solid var(--red)} .r h2{color:var(--red)}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.4em;vertical-align:-.05em}
.g .dot{background:var(--green)} .a .dot{background:var(--amber)} .r .dot{background:var(--red)}
h3{font-size:1em;margin:22px 0 8px;color:var(--brand-d)}
.res{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;background:#fff}
.res.first{border-color:var(--red);background:#fff8f7}
.res b{display:block}
.res small{display:block;color:var(--muted);font-size:.78em;margin-top:2px}
a.call{display:inline-block;margin:10px 8px 0 0;padding:12px 18px;border-radius:14px;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;min-height:48px}
a.call.red{background:var(--red)}
a.call.alt{background:var(--soft);color:var(--brand-d);border:2px solid var(--brand)}
ul.steps{padding-left:1.2em;margin:6px 0}
ul.steps li{margin:8px 0}
.skel{height:1em;background:linear-gradient(90deg,#e6f2ef,#f6fbf9,#e6f2ef);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.disc{margin-top:22px;padding:14px 16px;background:var(--soft);border-radius:14px;font-weight:600;text-align:center}
.note{color:var(--muted);font-size:.7em;margin-top:14px;text-align:center}
.sos{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;justify-content:center;align-items:center;font-size:.72em;color:var(--muted);flex-wrap:wrap}
.sos a{color:var(--red);font-weight:700;text-decoration:none;padding:8px 12px;border:2px solid var(--red);border-radius:12px}
.hide{display:none}
</style>

  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="onclick")e.onclick=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c??"")));
  return e;
}

function renderSOS(){
  const x=$("#sos"); x.replaceChildren();
  x.append(el("span",{},t().sosline),
    el("a",{href:"tel:112"},"112"),
    el("a",{href:"tel:14416"},"Tele-MANAS 14416"));
}

function render(){
  document.documentElement.lang=S.lang==="hi"?"hi":"en";
  document.body.classList.toggle("large",S.age==="60p");
  $("#tag").textContent=t().tag;
  renderSOS();
  app.replaceChildren();
  window.scrollTo({top:0});
  ({lang:vLang,age:vAge,stressor:vStr,intro:vIntro,quiz:vQuiz,result:vResult})[S.step]();
}

function optBtn(label,fn,cls=""){return el("button",{class:"opt "+cls,type:"button",onclick:fn},label);}
function restartBtn(){return el("div",{class:"center"},el("button",{class:"link",type:"button",onclick:()=>{reset();render();}},t().restart));}

function vLang(){
  app.append(el("h2",{},"Choose your language"),el("p",{class:"sub"},"भाषा चुनें"),
    el("div",{class:"row2"},
      optBtn("हिन्दी",()=>{S.lang="hi";S.step="age";render();},"big"),
      optBtn("English",()=>{S.lang="en";S.step="age";render();},"big")));
}
function vAge(){
  app.append(el("h2",{},t().age_q),el("p",{class:"sub"},t().age_s));
  const o=el("div",{class:"opts"});
  Object.entries(t().ages).forEach(([k,v])=>o.append(optBtn(v,()=>{S.age=k;S.step="stressor";render();})));
  app.append(o,restartBtn());
}
function vStr(){
  app.append(el("h2",{},t().str_q),el("p",{class:"sub"},t().str_s));
  const o=el("div",{class:"opts"});
  Object.entries(t().strs).forEach(([k,v])=>o.append(optBtn(v,()=>{S.stressor=k;S.step="intro";render();})));
  app.append(o,restartBtn());
}
function vIntro(){
  app.append(el("h2",{},t().intro),el("div",{class:"opts"},optBtn(t().begin,()=>{S.step="quiz";S.q=0;S.answers=[];render();},"big")),restartBtn());
}
function vQuiz(){
  const i=S.q;
  app.append(
    el("div",{class:"progress"},el("div",{style:`width:${(i/7)*100}%`})),
    el("div",{class:"pl"},el("span",{},t().qn(i+1))),
    el("div",{class:"stem"},t().stem),
    el("div",{class:"q"},t().qs[i]));
  const o=el("div",{class:"opts"});
  t().ans.forEach((a,v)=>o.append(optBtn(a,()=>{
    S.answers[i]=v;
    if(i<6){S.q++;render();}else{S.step="result";render();}
  })));
  app.append(o);
  const nav=el("div",{});
  if(i>0)nav.append(el("button",{class:"link",type:"button",onclick:()=>{S.q--;render();}},t().back));
  nav.append(el("button",{class:"link",type:"button",onclick:()=>{reset();render();}},t().restart));
  app.append(nav);
}

/* ============ SCORING ============ */
function evaluate(){
  const score=S.answers.reduce((a,b)=>a+b,0);   // 0 - 21
  const selfHarm=S.answers[6]>0;                // any answer other than "Not at all"
  let level="green";
  if(selfHarm||score>=13)level="red";
  else if(score>=7)level="amber";
  return {score,selfHarm,level};
}

/* ============ RESOURCES (rendered locally from the notes) ============ */
function resList(level,selfHarm,under18){
  const R=t().r, L=[];
  const tm=(desc)=>({id:"tm",name:R.tm.n,desc,calls:[["14416","14416"],["1800-891-4416","18008914416"]],first:true});
  if(selfHarm||level==="red"){
    L.push(tm(R.tm.d));
    L.push({id:"112",name:R.p112.n,desc:R.p112.d,calls:[["112","112"]]});
    L.push({id:"nim",name:R.nim.n,desc:R.nim.d,calls:[["080-46110007","08046110007"]]});
    L.push({id:"hosp",name:R.hosp.n,desc:R.hosp.d});
    L.push({id:"dmhp",name:R.dmhp.n,desc:R.dmhp.d});
  }else if(level==="amber"){
    L.push(tm(R.tm.d2));
    L.push({id:"icall",name:R.icall.n,desc:R.icall.d,calls:[["9152987821","9152987821"]],email:"icall@tiss.ac.in"});
    L.push({id:"dmhp",name:R.dmhp.n,desc:R.dmhp.d});
  }else{
    L.push({...tm(R.tm.d3),first:false});
  }
  if(under18){
    const c={id:"child",name:R.child.n,desc:R.child.d,calls:[["1098","1098"]]};
    // keep Tele-MANAS first in emergencies; otherwise put Childline right after the first item
    L.splice(1,0,c);
  }
  return L;
}
function resCard(r,red){
  const c=el("div",{class:"res"+(r.first&&red?" first":"")},el("b",{},r.name),el("small",{},r.desc));
  const box=el("div",{});
  (r.calls||[]).forEach(([lbl,num])=>box.append(el("a",{class:"call"+(red&&r.first?" red":""),href:"tel:"+num},`📞 ${t().call} ${lbl}`)));
  if(r.email)box.append(el("a",{class:"call alt",href:"mailto:"+r.email},`✉ ${r.email}`));
  c.append(box);return c;
}

/* ============ GEMINI ============ */
function buildPrompt(ev){
  const langName=S.lang==="hi"?"Hindi (Devanagari script)":"English";
  const ageName=T.en.ages[S.age], strName=T.en.strs[S.stressor];
  return `You are the voice of "Maan Saathi", a gentle mental health screening guide for people in India.

INPUT
- Result level (already decided, do not change it): ${ev.level.toUpperCase()}
- Screening score: ${ev.score} out of 21
- Age band: ${ageName}
- Main stressor: ${strName}
- Any self-harm answer: ${ev.selfHarm?"YES":"no"}

${RESOURCE_NOTES}

TASK
Write in ${langName}, in warm, simple, non-clinical language that a 12-year-old or a 70-year-old can follow.
Return ONLY JSON of this exact shape:
{"explanation":["line1","line2","line3"],"steps":["step1","step2"]}
- "explanation": EXACTLY 3 short lines. Explain gently what the answers suggest and that support is available.${ev.selfHarm?" The person indicated thoughts of self-harm: be especially caring, say they are not alone, and that the helplines shown first can be called right now. Never mention methods.":""}
- "steps": 2 or 3 simple self-care steps that fit the age band and the main stressor. Everyday actions only (rest, breathing, routine, talking to someone, short walk, writing things down).${S.age==="u18"?" Include talking to a trusted adult (parent, teacher, school counsellor).":""}

STRICT RULES
- Never diagnose. Never name any disorder or condition. Say "your answers suggest you may benefit from talking to a professional" and never "you have X".
- Never give medication, supplement or dosage advice.
- Answer ONLY using the RESOURCE NOTES for any helpline, service or organisation. Do not mention any phone number, organisation or website that is not in the notes. Prefer not to write phone numbers at all; the app shows them separately.
- Do not add the closing disclaimer; the app adds it.
- No markdown, no emojis, no extra keys.`;
}

function safeText(x){
  if(typeof x!=="string")return null;
  const s=x.trim();
  if(!s||s.length>400)return null;
  if(/\d{3,}/.test(s))return null;                                   // no invented numbers
  if(/(medicine|medication|tablet|pill|dose|dosage|antidepress|दवा|दवाई|गोली|खुराक)/i.test(s))return null;
  if(/(you have|you are suffering from|diagnos|आपको .* (है|हैं) बीमारी|डिप्रेशन है|एंग्जायटी है)/i.test(s))return null;
  return s;
}

async function askGemini(ev){
  if(!GEMINI_API_KEY||GEMINI_API_KEY==="YOUR_KEY_HERE")throw new Error("no key");
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`,{
      method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        contents:[{role:"user",parts:[{text:buildPrompt(ev)}]}],
        generationConfig:{temperature:0.4,responseMimeType:"application/json"}
      })
    });
    if(!r.ok)throw new Error("http "+r.status);
    const j=await r.json();
    const raw=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
    const obj=JSON.parse(raw.replace(/^```json|```$/g,"").trim());
    const exp=(obj.explanation||[]).map(safeText);
    const steps=(obj.steps||[]).map(safeText);
    if(exp.length!==3||exp.some(x=>!x))throw new Error("bad explanation");
    if(steps.length<2||steps.length>3||steps.some(x=>!x))throw new Error("bad steps");
    return {exp,steps};
  }finally{clearTimeout(to);}
}

function fallback(ev){
  const f=t().fb;
  return {exp:f[ev.level],steps:[f.step[S.stressor],f.age[S.age],f.breath].slice(0,3)};
}

/* ============ RESULT ============ */
function vResult(){
  const ev=evaluate(), under18=S.age==="u18";
  const L=t().levels;
  const cls={green:"g",amber:"a",red:"r"}[ev.level];
  const banner=el("div",{class:"banner "+cls},
    el("h2",{},el("span",{class:"dot"}),L[ev.level]));
  if(ev.selfHarm)banner.append(el("p",{style:"margin:6px 0 0"},t().selfharm_banner));
  app.append(banner);

  const red=ev.level==="red";
  const resBox=el("div",{});
  const resources=resList(ev.level,ev.selfHarm,under18).map(r=>resCard(r,red));

  // Self-harm / Red: helplines FIRST, guidance after
  if(red){ app.append(el("h3",{style:"margin-top:0"},t().res_h),resBox); resources.forEach(c=>resBox.append(c)); }

  const guide=el("div",{});
  guide.append(el("h3",{style:red?"":"margin-top:0"},t().exp_h),
    el("div",{class:"skel"}),el("div",{class:"skel"}),el("div",{class:"skel"}),
    el("p",{class:"sub"},t().loading));
  app.append(guide);

  if(!red){ app.append(el("h3",{},t().res_h),resBox); resources.forEach(c=>resBox.append(c)); }

  if(under18){
    app.append(el("h3",{},t().adult_h),el("div",{class:"res"},t().adult));
  }
  app.append(el("div",{class:"disc"},t().disc),el("p",{class:"note"},t().checked),restartBtn());

  const fill=(g,offline)=>{
    guide.replaceChildren(el("h3",{style:red?"":"margin-top:0"},t().exp_h));
    g.exp.forEach(x=>guide.append(el("p",{style:"margin:6px 0"},x)));
    guide.append(el("h3",{},t().steps_h));
    const ul=el("ul",{class:"steps"});g.steps.forEach(x=>ul.append(el("li",{},x)));
    guide.append(ul);
    if(offline)guide.append(el("p",{class:"note",style:"text-align:left"},t().err_note));
  };

  const lang0=S.lang;
  askGemini(ev).then(g=>{ if(S.step==="result"&&S.lang===lang0)fill(g,false); })
               .catch(()=>{ if(S.step==="result"&&S.lang===lang0)fill(fallback(ev),true); });
}

render();
</script>
